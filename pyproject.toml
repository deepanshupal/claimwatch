[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "claimwatch"
version = "0.1.0"
description = "Watch domains and social handles for meaningful identity changes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Deepanshu Pal"}]
dependencies = ["PyYAML>=6.0,<7", "idna>=3.7,<4"]
keywords = ["domain-monitoring", "username-checker", "brand-monitoring", "osint", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
claimwatch = "claimwatch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
